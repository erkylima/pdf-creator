<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap');

        :root {
            --midnight-slate: #22293e;
            --golden-harvest: #f0ba3e;
            --slate-blue: #343f5f;
            --deep-charcoal: #10131d;
            --creamy-gold: #f4cb6d;
            --rich-amber: #e9a812;
            --white: #ffffff;
            --gray-light: #f5f7fa;
        }

        @page { size: 1080px 1350px; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        .slide {
            --slide-padding: 100px;
            --footer-height: 162px;
            --footer-gap: 60px;
            width: 1080px;
            height: 1350px;
            page-break-after: always;
            padding: var(--slide-padding);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .theme-dark {
            background: linear-gradient(135deg, var(--deep-charcoal) 0%, var(--midnight-slate) 100%);
            color: var(--white);
        }
        .theme-light {
            background: linear-gradient(135deg, #ffffff 0%, #eaeff5 100%);
            color: var(--midnight-slate);
        }
        .theme-gold {
            background: linear-gradient(135deg, var(--creamy-gold) 0%, var(--rich-amber) 100%);
            color: var(--deep-charcoal);
        }
        .slide-background {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .slide-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            position: relative;
            width: 100%;
        }

        .slide.has-photo-right .content-wrapper { max-width: 60%; padding-right: 20px; }
        .slide.has-photo-left .content-wrapper { max-width: 60%; margin-left: auto; padding-left: 20px; }

        .structured-layout {
            max-width: none;
            margin: 0;
            padding: 0;
            justify-content: flex-start;
            align-items: center;
        }

        .slide-heading {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .structured-layout .tag {
            margin-bottom: 24px;
        }

        .structured-layout h1 {
            margin-bottom: 0;
        }

        .structured-slide-copy {
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: auto;
            padding: 0 12px;
            text-align: center;
        }

        .has-content-cards .slide-content-card {
            position: relative;
            z-index: 3;
            width: 100%;
            margin-top: auto;
            margin-bottom: -40px;
            padding: 32px;
            border-radius: 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        }

        .theme-dark.has-content-cards .slide-content-card {
            border: 2px solid rgba(240, 186, 62, 0.68);
            background: linear-gradient(135deg, rgba(16, 19, 29, 0.94), rgba(34, 41, 62, 0.94));
            color: var(--white);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3), 0 0 28px rgba(240, 186, 62, 0.12);
        }

        .theme-light.has-content-cards .slide-content-card {
            border: 2px solid rgba(240, 186, 62, 0.58);
            background: linear-gradient(135deg, rgba(34, 41, 62, 0.97), rgba(16, 19, 29, 0.97));
            color: var(--white);
        }

        .theme-gold.has-content-cards .slide-content-card {
            border: 2px solid rgba(244, 203, 109, 0.72);
            background: linear-gradient(135deg, rgba(34, 41, 62, 0.97), rgba(16, 19, 29, 0.97));
            color: var(--white);
        }

        .has-content-cards .slide-content-card > p {
            margin-bottom: 24px;
            text-align: center;
            font-size: 30px;
            line-height: 1.4;
        }

        .theme-light.has-content-cards .slide-content-card > p,
        .theme-gold.has-content-cards .slide-content-card > p {
            color: rgba(255, 255, 255, 0.9);
        }

        .content-cards {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .content-subcard {
            flex: 1 1 180px;
            min-width: 0;
            padding: 20px 18px;
            border-radius: 18px;
            text-align: center;
        }

        .theme-dark .content-subcard {
            border: 1px solid rgba(240, 186, 62, 0.42);
            background: linear-gradient(145deg, rgba(34, 41, 62, 0.94), rgba(16, 19, 29, 0.94));
            color: var(--white);
        }

        .theme-light .content-subcard {
            border: 1px solid rgba(240, 186, 62, 0.42);
            background: linear-gradient(145deg, rgba(52, 63, 95, 0.98), rgba(34, 41, 62, 0.98));
            color: var(--white);
        }

        .theme-gold .content-subcard {
            border: 1px solid rgba(244, 203, 109, 0.58);
            background: linear-gradient(145deg, rgba(52, 63, 95, 0.98), rgba(34, 41, 62, 0.98));
            color: var(--white);
        }

        .theme-light .content-subcard strong,
        .theme-gold .content-subcard strong { color: var(--creamy-gold); }
        .theme-light .content-subcard span,
        .theme-gold .content-subcard span { color: rgba(255, 255, 255, 0.82); }

        .content-subcard strong,
        .content-subcard span {
            display: block;
        }

        .content-subcard strong {
            color: var(--creamy-gold);
            font-size: 23px;
            line-height: 1.25;
        }

        .content-subcard span {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 18px;
            line-height: 1.35;
        }

        .tag {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .theme-dark .tag { color: var(--golden-harvest); }
        .theme-light .tag { color: var(--slate-blue); }
        .theme-gold .tag { color: var(--midnight-slate); }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 88px;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 48px;
        }

        p {
            font-size: 42px;
            line-height: 1.5;
            font-weight: 400;
        }

        .theme-dark p { color: rgba(255,255,255,0.85); }
        .theme-light p { color: var(--slate-blue); }
        .theme-gold p { color: var(--deep-charcoal); }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: var(--footer-height);
            flex: 0 0 var(--footer-height);
            padding-top: 40px;
            border-top: 2px solid;
            margin-top: var(--footer-gap);
            z-index: 3;
            position: relative;
            width: 100%;
        }

        .slide.has-photo-left .footer {
            justify-content: space-between;
            gap: 18px;
        }

        .theme-dark .footer { border-color: rgba(255,255,255,0.1); }
        .theme-light .footer { border-color: rgba(34, 41, 62, 0.1); }
        .theme-gold .footer { border-color: rgba(16, 19, 29, 0.1); }

        .logo-placeholder {
            height: 120px;
            width: auto;
            max-width: 420px;
            object-fit: contain;
            display: inline-block;
        }
        .hidden-logo {
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
        }
        .page-indicator {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: 2px;
            margin-left: auto;
        }

        .photo-wrapper {
            position: absolute;
            bottom: 0;
            z-index: 1;
            height: 100%;
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            overflow: visible;
        }

        .photo-wrapper.photo-bottom-right { right: -150px; left: auto; }
        .photo-wrapper.photo-bottom-left { left: -180px; right: auto; }
        .photo-wrapper.photo-center {
            height: 55%;
            bottom: calc(var(--slide-padding) + var(--footer-height));
            top: auto;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            align-items: flex-end;
            justify-content: center;
        }

        .personal-photo {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: bottom center;
            opacity: 1;
            display: block;
        }

        .flip-horizontal { transform: scaleX(-1); }
        .photo-shadow { filter: none; }
    </style>
</head>
<body>
    <div id="slides-container">
        <!-- O JS irá injetar os slides aqui -->
    </div>
</body>
</html>
